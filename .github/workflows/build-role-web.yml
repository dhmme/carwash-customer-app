name: Build Worker and Manager Web Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/web/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - role: worker
            target: lib/main_worker.dart
          - role: manager
            target: lib/main_manager.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build role web application
        run: flutter build web --release -t ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: code-care-${{ matrix.role }}-web
          path: build/web
          retention-days: 14
