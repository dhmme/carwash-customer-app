name: Build Flutter Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/web/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build customer web app
        run: flutter build web --release -t lib/main.dart

      - name: Build worker web app
        run: |
          flutter build web --release -t lib/main_worker.dart
          rm -rf deploy/worker
          mkdir -p deploy/worker
          cp -R build/web/. deploy/worker/
          cp vercel.role.json deploy/worker/vercel.json

      - name: Build manager web app
        run: |
          flutter build web --release -t lib/main_manager.dart
          rm -rf deploy/manager
          mkdir -p deploy/manager
          cp -R build/web/. deploy/manager/
          cp vercel.role.json deploy/manager/vercel.json

      - name: Restore customer web app
        run: flutter build web --release -t lib/main.dart

      - name: Commit generated web files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/web deploy/worker deploy/manager
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build customer, worker, and manager web apps [skip ci]"
            git push origin HEAD:main
          fi
