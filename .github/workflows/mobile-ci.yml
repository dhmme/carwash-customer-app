name: Verify Android and iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/web/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Google Maps key
        run: test -n "$GOOGLE_MAPS_API_KEY"
      - name: Build Android test APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: code-care-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iPhone app without store signing
        run: flutter build ios --release --no-codesign
